
name: Security Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit pytest

      # 4. Run security scan (dry-run)
      - name: Run security scan (dry-run)
        run: |
          python3 cli.py scan ./sample_project --json --dry-run > security_report.json || true

      # 5. Run unit tests
      - name: Run tests
        run: |
          pytest tests/ --junitxml=tests/reports/test_results.xml || true

      # 6. Upload security report as artifact
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security_report.json

      # 7. Upload test results as artifact
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/reports/test_results.xml

